<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Prevent theme flash by immediately applying theme from cookie
			(function () {
				const theme = document.cookie
					.split('; ')
					.find((row) => row.startsWith('theme='))
					?.split('=')[1];

				if (theme === 'dark') {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();

			// Load analytics script only if user has consented to analytics cookies
			(function () {
				try {
					const consent = localStorage.getItem('cookie-consent');
					if (consent) {
						const data = JSON.parse(consent);
						if (data.preferences && data.preferences.analytics === true) {
							const script = document.createElement('script');
							script.src = 'https://tj.appsdata.org/api/script.js';
							script.dataset.siteId = 'bec8b40684c3';
							script.defer = true;
							document.head.appendChild(script);
						}
					}
				} catch (e) {
					// Consent not available or parse error - don't load analytics
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
