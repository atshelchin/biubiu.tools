name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper diff

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get changed packages
        id: changed
        run: |
          # Get the commit range for this push
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push to branch, compare with parent
            CHANGED_PACKAGES=$(git diff --name-only HEAD~1 HEAD -- packages/ | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          else
            # Normal push, compare with previous state
            CHANGED_PACKAGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- packages/ | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          fi
          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT
          echo "Changed packages: $CHANGED_PACKAGES"
          echo "Comparing: ${{ github.event.before }} -> ${{ github.sha }}"

      - name: Install dependencies
        run: bun install

      - name: Build and publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in ${{ steps.changed.outputs.packages }}; do
            if [ -d "packages/$pkg" ] && [ -f "packages/$pkg/package.json" ]; then
              echo "📦 Processing package: $pkg"
              cd "packages/$pkg"

              # Get current version from npm
              PKG_NAME=$(jq -r '.name' package.json)
              LOCAL_VERSION=$(jq -r '.version' package.json)
              NPM_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")

              echo "Local version: $LOCAL_VERSION"
              echo "NPM version: $NPM_VERSION"

              # Only publish if version is higher
              if [ "$(printf '%s\n' "$NPM_VERSION" "$LOCAL_VERSION" | sort -V | tail -n1)" = "$LOCAL_VERSION" ] && [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
                echo "🚀 Publishing $PKG_NAME@$LOCAL_VERSION"
                bun run build
                npm publish --provenance --access public
              else
                echo "⏭️ Skipping $PKG_NAME (version $LOCAL_VERSION already published or lower)"
              fi

              cd ../..
            fi
          done
