name: Feature Request
description: Suggest a new feature or improvement for BiuBiu Tools
title: '[Feature]: '
labels: ['enhancement']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We appreciate your ideas to make BiuBiu Tools better.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? Please describe.
      placeholder: |
        A clear description of what the problem is.
        Example: "I'm always frustrated when..." or "It would be great if..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: What other approaches have you thought about?

  - type: dropdown
    id: tool
    attributes:
      label: Related Tool
      description: Which tool does this feature relate to?
      options:
        - One-to-Many Transfer
        - Token Balance Scanner
        - Wallet Sweep
        - Wallet Generator
        - ENS Scanner
        - Contract Events Scanner
        - DEX Moonshot Trader
        - Assets Monitor
        - Chainlist
        - Chain Tools
        - New Tool Idea
        - General / Platform-wide
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important for my workflow
        - Critical / Blocking my use

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request.
      placeholder: Any additional information, screenshots, or mockups...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions to ensure this feature hasn't been requested before
          required: true
        - label: I believe this feature would benefit other users as well
          required: false
