name: Bug Report
description: Report a bug or unexpected behavior in BiuBiu Tools
title: '[Bug]: '
labels: ['bug', 'triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
      placeholder: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool is affected?
      description: Select the tool where you encountered the bug.
      options:
        - One-to-Many Transfer
        - Token Balance Scanner
        - Wallet Sweep
        - Wallet Generator
        - ENS Scanner
        - Contract Events Scanner
        - DEX Moonshot Trader
        - Assets Monitor
        - Chainlist
        - Chain Tools
        - Other / General
    validations:
      required: true

  - type: input
    id: network
    attributes:
      label: Network/Chain
      description: Which blockchain network were you using? (if applicable)
      placeholder: e.g., Ethereum Mainnet, Polygon, BSC, Base

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: What browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Brave
        - Other
    validations:
      required: true

  - type: dropdown
    id: wallet
    attributes:
      label: Wallet
      description: Which wallet are you using? (if applicable)
      options:
        - MetaMask
        - WalletConnect
        - Coinbase Wallet
        - Rabby
        - OKX Wallet
        - Other
        - Not applicable

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Drag and drop images here or paste image URLs

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Any errors shown in the browser console? (Press F12 to open developer tools)
      placeholder: Paste any console errors here
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Any other relevant information...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported before
          required: true
        - label: I have provided all the requested information
          required: true
